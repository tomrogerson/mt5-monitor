<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0b1012">
<meta name="robots" content="noindex">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icon-180.png">
<title>MT5 Monitor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap">
<style>
:root{
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#0b1012;--surface:#121a1d;--line:#223036;--fg:#e4ecec;--fg-2:#9db0b4;
  --accent:#d9b65c;--down:#ff7266;--down-bg:rgba(255,114,102,.13);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
form{width:100%;max-width:340px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:24px}
h1{margin:0 0 4px;font-size:20px;font-weight:700}
p{margin:0 0 18px;color:var(--fg-2)}
label{display:block;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-2);margin-bottom:6px}
input{width:100%;font:500 16px var(--font-body);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
button{width:100%;margin-top:14px;font:600 15px var(--font-body);color:#16130a;background:var(--accent);border:0;border-radius:8px;padding:12px;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{display:none;margin:0 0 14px;padding:8px 12px;border-radius:8px;background:var(--down-bg);color:var(--down);font-size:13.5px}
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>MT5 Monitor</h1>
  <p>Enter your password to continue.</p>
  <div class="err" id="err" role="alert"></div>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
  <button type="submit">Log in</button>
</form>
<script>
(function(){
  var e = new URLSearchParams(location.search).get('e');
  var el = document.getElementById('err');
  if(e==='1'){ el.textContent='That password is not right.'; el.style.display='block'; }
  if(e==='2'){ el.textContent='Too many attempts. Wait a few minutes and try again.'; el.style.display='block'; }
})();
</script>
</body>
</html>
